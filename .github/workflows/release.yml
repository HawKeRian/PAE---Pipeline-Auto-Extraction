name: Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build and project dependencies
        run: python -m pip install build && python -m pip install -r requirements.txt
      - name: Quality and security gates
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest
          detect-secrets scan src/pae
          pip-audit -r requirements.txt
      - name: Build versioned Python artifacts
        run: python -m build
      - name: Build and smoke-test container
        run: |
          docker build -t pae:${GITHUB_REF_NAME:-candidate} -f Containerfile .
          docker run -d --name pae-rc -p 8000:8000 -e PAE_READINESS_REQUIRE_MODEL=false pae:${GITHUB_REF_NAME:-candidate}
          for attempt in $(seq 1 30); do curl --fail http://127.0.0.1:8000/ready && break; sleep 2; done
          python scripts/smoke_test.py
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@v4
        with:
          name: pae-${{ github.ref_name || 'candidate' }}
          path: |
            dist/*
            Containerfile
            deploy/compose.yaml
            configs/production.env.example
          if-no-files-found: error
