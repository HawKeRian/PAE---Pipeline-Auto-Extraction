services:
  pae:
    build:
      context: ..
      dockerfile: Containerfile
    image: localhost/pae:0.1.0
    restart: unless-stopped
    env_file:
      - ../configs/production.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pae-data:/app/data
      - pae-generated:/app/generated
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/data/workspaces:size=512m,mode=0700
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3))['status']=='ready'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pae-data:
  pae-generated:
